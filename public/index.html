<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="module">
      const sysTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      const theme = localStorage.getItem("theme") ?? sysTheme;
      document.children[0].setAttribute("data-theme", theme);
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-light.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Trackout</title>
  </head>
  <body id="root"></body>
</html>
